spring.application.name=DocumentManagement
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration

# OpenSearch Native Client Configuration
app.opensearch.enabled=${APP_OPENSEARCH_ENABLED:true}
app.opensearch.host=localhost
app.opensearch.port=9200
app.opensearch.username=admin
app.opensearch.password=ASLgemini916
app.opensearch.https=${OPENSEARCH_HTTPS:true}

# OpenSearch Index Settings
app.opensearch.documents-index=dms-documents
app.opensearch.folders-index=dms-document-folders
app.opensearch.users-index=dms-app-users
app.opensearch.groups-index=dms-user-groups
app.opensearch.audit-index=dms-audit-logs
app.opensearch.knowledge-index=dms-knowledge
app.opensearch.user-tasks-index=dms-user-tasks
app.opensearch.ocr-documents-index=dms-ocr-document
app.opensearch.chatbot-documents-index=dms-documents-chatbot
app.opensearch.chatbot-chunks-index=dms-documents-chatbot-chunks
app.opensearch.attachments-index=dms-attachments
app.opensearch.attachments-pipeline=dms-attachments-pipeline

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P@ssw0rd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
app.security.password-encryption-key=a3f7c2e9b1d4f8a6c5e2b9d1f4a7c3e0
app.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:http://localhost:11434}
app.ai.deepseek.chat-path=${DEEPSEEK_CHAT_PATH:/api/chat}
app.ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-r1:1.5b}
app.ai.deepseek.timeout=${DEEPSEEK_TIMEOUT:60s}

app.ocr.dots.base-url=${DOTSOCR_BASE_URL:http://172.29.199.200:9000}
app.ocr.dots.pdf-path=${DOTSOCR_PDF_PATH:/ocr/pdf}
app.ocr.dots.timeout=${DOTSOCR_TIMEOUT:300s}
app.ocr.batch-page-limit=${OCR_BATCH_PAGE_LIMIT:32}
app.ai.extraction.base-url=${EXTRACTION_API_BASE_URL:http://localhost:5001}
app.ai.extraction.extract-path=${EXTRACTION_API_EXTRACT_PATH:/extract}
app.ai.extraction.timeout=${EXTRACTION_API_TIMEOUT:180s}
app.ai.embedding.base-url=${EMBEDDING_API_BASE_URL:http://localhost:5101}
app.ai.embedding.start-job-path=${EMBEDDING_API_START_JOB_PATH:/embed/jobs}
app.ai.embedding.timeout=${EMBEDDING_API_TIMEOUT:180s}

# One-time MySQL -> OpenSearch migration for folders/documents/versions.
app.migration.mysql-to-opensearch.enabled=${APP_MIGRATION_MYSQL_TO_OPENSEARCH_ENABLED:true}
app.migration.mysql-to-opensearch.force=${APP_MIGRATION_MYSQL_TO_OPENSEARCH_FORCE:false}
