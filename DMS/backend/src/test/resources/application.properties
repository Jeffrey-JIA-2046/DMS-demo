# OpenSearch Test Configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration
app.opensearch.host=localhost
app.opensearch.port=9200
app.opensearch.username=admin
app.opensearch.password=admin
app.opensearch.https=false
app.security.password-encryption-key=0123456789ABCDEF0123456789ABCDEF

# Use test MySQL (adjust credentials as needed)
spring.datasource.url=jdbc:mysql://localhost:3306/DMS?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
