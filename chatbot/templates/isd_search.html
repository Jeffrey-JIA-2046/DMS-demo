<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Releases Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #1a5276;
            --accent-color: #e74c3c;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ecf0f1;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .search-container {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--box-shadow);
            margin-bottom: 2rem;
        }
        
        .search-box {
            display: flex;
            margin-bottom: 1rem;
        }
        
        #searchInput {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #searchInput:focus {
            border-color: var(--primary-color);
        }
        
        #searchButton {
            padding: 0 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        #searchButton:hover {
            background-color: var(--secondary-color);
        }
        
        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--secondary-color);
        }
        
        input[type="date"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
        }
        
        .results-container {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--box-shadow);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        .results-count {
            font-weight: 500;
            color: var(--secondary-color);
        }
        
        .result {
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: var(--border-radius);
            background-color: var(--light-color);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid var(--primary-color);
        }
        
        .result:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            border-left-color: var(--accent-color);
        }
        
        .result-title {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }
        
        .result-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }
        
        .result-score {
            background-color: var(--primary-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .result-date {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .result-content {
            margin-bottom: 0.75rem;
            line-height: 1.7;
        }
        
        .highlight {
            background-color: #fff3bf;
            padding: 0 0.2rem;
            font-weight: 500;
        }
        
        .result-url {
            margin-top: 0.75rem;
        }
        
        .result-url a {
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.9rem;
            word-break: break-all;
        }
        
        .result-url a:hover {
            text-decoration: underline;
            color: var(--accent-color);
        }
        
        .no-results {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .filters {
                flex-direction: column;
                gap: 1rem;
            }
            
            .filter-group {
                width: 100%;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-newspaper"></i> Press Releases Search</h1>
            <p>Search through archived press releases with powerful filters</p>
        </header>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search press releases...">
                <button id="searchButton"><i class="fas fa-search"></i> Search</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="startDate"><i class="far fa-calendar-alt"></i> From Date</label>
                    <input type="date" id="startDate">
                </div>
                
                <div class="filter-group">
                    <label for="endDate"><i class="far fa-calendar-alt"></i> To Date</label>
                    <input type="date" id="endDate">
                </div>
            </div>
        </div>
        
        <div class="results-container">
            <div class="results-header">
                <h2>Search Results</h2>
                <div class="results-count">0 results found</div>
            </div>
            
            <div class="loading">
                <div class="spinner"></div>
                <p>Searching press releases...</p>
            </div>
            
            <div id="resultsList"></div>
            
            <div class="no-results" id="noResults">
                <i class="far fa-file-alt" style="font-size: 3rem; color: #ccc; margin-bottom: 1rem;"></i>
                <p>No press releases found matching your criteria.</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const startDate = document.getElementById('startDate');
            const endDate = document.getElementById('endDate');
            const resultsList = document.getElementById('resultsList');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.querySelector('.results-count');
            const loading = document.querySelector('.loading');
            
            // Set default dates (last 2 years)
            const today = new Date();
            const twoYearsAgo = new Date();
            twoYearsAgo.setFullYear(today.getFullYear() - 2);
            
            startDate.valueAsDate = twoYearsAgo;
            endDate.valueAsDate = today;
            
            // Perform search on button click
            searchButton.addEventListener('click', performSearch);
            
            // Perform search on Enter key
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            // Perform search when date filters change
            startDate.addEventListener('change', performSearch);
            endDate.addEventListener('change', performSearch);
            
            function performSearch() {
                const query = searchInput.value.trim();
                const startDateValue = startDate.value;
                const endDateValue = endDate.value;
                
                // Show loading indicator
                loading.style.display = 'block';
                resultsList.innerHTML = '';
                noResults.style.display = 'none';
                
                // Build query parameters
                const params = new URLSearchParams();
                if (query) params.append('q', query);
                if (startDateValue) params.append('start_date', startDateValue);
                if (endDateValue) params.append('end_date', endDateValue);
                
                fetch(`/search?${params.toString()}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        loading.style.display = 'none';
                        
                        if (data.error) {
                            resultsList.innerHTML = `<div class="result"><p>Error: ${data.error}</p></div>`;
                            noResults.style.display = 'none';
                            resultsCount.textContent = '0 results found';
                            return;
                        }
                        
                        resultsCount.textContent = `${data.total} ${data.total === 1 ? 'release' : 'releases'} found`;
                        
                        if (data.total === 0) {
                            noResults.style.display = 'block';
                            return;
                        }
                        
                        noResults.style.display = 'none';
                        
                        data.results.forEach(result => {
                            const resultDiv = document.createElement('div');
                            resultDiv.className = 'result';
                            
                            // Title with highlight if available
                            const title = document.createElement('h3');
                            title.className = 'result-title';
                            if (result.highlight && result.highlight.title) {
                                title.innerHTML = result.highlight.title.join('...');
                            } else {
                                title.textContent = result.source.title || 'Untitled Press Release';
                            }
                            resultDiv.appendChild(title);
                            
                            // Metadata (score and date)
                            const metaDiv = document.createElement('div');
                            metaDiv.className = 'result-meta';
                            
                            const scoreSpan = document.createElement('span');
                            scoreSpan.className = 'result-score';
                            scoreSpan.innerHTML = `<i class="fas fa-star"></i> Relevance: ${result.score.toFixed(2)}`;
                            metaDiv.appendChild(scoreSpan);
                            
                            if (result.source.formatted_date) {
                                const dateSpan = document.createElement('span');
                                dateSpan.className = 'result-date';
                                dateSpan.innerHTML = `<i class="far fa-calendar"></i> ${result.source.formatted_date}`;
                                metaDiv.appendChild(dateSpan);
                            }
                            
                            resultDiv.appendChild(metaDiv);
                            
                            // Content with highlight if available
                            if (result.source.press_release || (result.highlight && result.highlight.press_release)) {
                                const contentDiv = document.createElement('div');
                                contentDiv.className = 'result-content';
                                
                                if (result.highlight && result.highlight.press_release) {
                                    contentDiv.innerHTML = result.highlight.press_release.join('...') + '...';
                                } else {
                                    const content = result.source.press_release || '';
                                    contentDiv.textContent = content.substring(0, 300) + (content.length > 300 ? '...' : '');
                                }
                                
                                resultDiv.appendChild(contentDiv);
                            }
                            
                            // URL if available
                            if (result.source.url) {
                                const urlDiv = document.createElement('div');
                                urlDiv.className = 'result-url';
                                urlDiv.innerHTML = `<a href="${result.source.url}" target="_blank"><i class="fas fa-external-link-alt"></i> View original release</a>`;
                                resultDiv.appendChild(urlDiv);
                            }
                            
                            resultsList.appendChild(resultDiv);
                        });
                    })
                    .catch(error => {
                        loading.style.display = 'none';
                        resultsList.innerHTML = `<div class="result"><p>Error: ${error.message}</p></div>`;
                        noResults.style.display = 'none';
                        resultsCount.textContent = '0 results found';
                        console.error('Error:', error);
                    });
            }
            
            // Perform initial search
            performSearch();
        });
    </script>
</body>
</html>
